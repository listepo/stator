# Gated scan pipeline from pyrlyn/ci: CodeQL, Semgrep and Snyk in parallel behind
# `pipeline / gate`. Rust CI is off (`rust: false`): stator has no Rust; its CI
# stays in ci.yml.
# Inputs, secrets and permissions: pyrlyn/ci docs/reusable-workflows.md.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: pyrlyn/ci/.github/workflows/pipeline.yml@c875cd763ad0c4abbd936e480be5752330d3b66b # main 2026-10-07
    permissions:
      contents: read
      security-events: write
      actions: write # cancel-run on failure, required by pyrlyn/ci pipeline.yml
    with:
      rust: false
      # TypeScript/JavaScript and the C runtime; no other CodeQL languages.
      codeql-languages: '["actions", "c-cpp", "javascript-typescript"]'
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
