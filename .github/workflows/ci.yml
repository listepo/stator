name: ci

on:
  push:
  pull_request:

# A push that supersedes an in-flight run cancels it: six platforms times five jobs is a lot of
# runner time to spend proving something about a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `pnpm run ci` is ONE SERIAL CHAIN by design -- it is the gate a human runs before claiming a task
# done (AGENTS.md golden rule 1), and serial is what makes its first failure the interesting one.
# CI wants the opposite: every step that does not feed another should run at the same time. So the
# chain is decomposed here, and this map is what says nothing was dropped in the process:
#
#   typecheck   -> static (once) + frontend (every platform)
#   lint        -> static
#   dupes       -> static
#   test        -> frontend
#   test:coverage -> frontend (linux/x64; lcov artifact)
#   runtime     -> runtime
#   test:runtime-> runtime
#   test:subset -> frontend
#   test:golden -> runtime
#   test:builtins-> runtime
#   test:leak   -> runtime
#   test:asan   -> asan
#
# Plus `test:intl`, which is deliberately NOT part of `pnpm run ci` (the ICU feature build is off by
# default, plan.md Task 4.4) and therefore had no coverage at all until this job existed.

jobs:
  # Test262 is intentionally separate from pnpm run ci: a missing corpus must not make the local
  # offline gate lie, while this job makes the pinned conformance number visible on every commit.
  test262:
    name: test262 conformance
    runs-on: ubuntu-24.04
    # The full pinned corpus is ~54k tests. The runner pools over every core, but this job is still
    # the long pole by an order of magnitude, so give it a ceiling of its own rather than letting it
    # inherit the 6-hour default and look hung.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: tests/test262/corpus
          key: test262-${{ hashFiles('tests/test262/pin.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test262:fetch
      - name: Run Test262
        # `pipefail` is NOT the default for a `run:` step, and without it `tee` decides this job's
        # exit status -- the ratchet could fail and the job would still be green, which is the
        # dishonest version of a conformance heartbeat (§9's opening paragraph).
        shell: bash
        run: |
          set -o pipefail
          pnpm run test262 2>&1 | tee test262.log
      - name: Publish conformance summary
        if: always()
        run: grep '^test262:' test262.log >> "$GITHUB_STEP_SUMMARY" || true

  # Host-independent by construction: no native code, no filesystem semantics, no clang. Running
  # these six times would prove the same thing six times.
  static:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run dupes

  # The compiler itself, which is portable TypeScript -- so this is the half of the suite Windows
  # can reach, and the reason Windows is in the matrix at all. `lint` is NOT here: Biome's formatter
  # would be arguing with git's line-ending translation, not with the code.
  frontend:
    name: frontend (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: macos, arch: x64, os: macos-15-intel }
          - { platform: macos, arch: arm64, os: macos-14 }
          - { platform: windows, arch: x64, os: windows-2025 }
          - { platform: windows, arch: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
        if: runner.os != 'Windows'
        with:
          just-version: '1.58.0'
      - uses: ./.github/actions/setup
      - name: Record toolchain
        shell: bash
        run: |
          node --version
          node -p "process.platform + '/' + process.arch"
          uname -srm || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:subset
      # A handful of unit tests compile and execute a native binary, so they need the archive the
      # Unix justfile builds. Windows has no such toolchain, so those tests skip THEMSELVES there
      # (`NATIVE_ONLY` in tests/unit/helpers.ts) and the rest of the file still runs -- which is
      # why unit tests below are unconditional and only this build step is gated.
      # linux/x64 is the coverage owner: it has the runtime archive, so native-only tests
      # actually run, and one platform is enough for the lcov artifact.
      - name: Build runtime archive
        if: runner.os != 'Windows'
        run: pnpm run runtime
      - name: Unit tests with coverage
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: pnpm run test:coverage
      - name: Upload coverage
        if: ${{ always() && matrix.platform == 'linux' && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Unit tests
        if: ${{ !(matrix.platform == 'linux' && matrix.arch == 'x64') }}
        run: pnpm run test

  # The C runtime and everything that links it. Unix only: the runtime's just/clang toolchain is
  # not ported to Windows, and pretending otherwise with a red job helps nobody.
  runtime:
    name: runtime (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: macos, arch: x64, os: macos-15-intel }
          - { platform: macos, arch: arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.58.0'
      - uses: ./.github/actions/setup
      # Without bdw-gc the justfile silently falls back to malloc and `test:leak` SKIPS -- a green
      # run that proved nothing about GC hygiene (plan.md Task 4.5). Installing it is what makes
      # the leak job's plateau assertion a real assertion.
      - name: Install Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libgc-dev clang llvm
          else
            brew install bdw-gc
          fi
      - name: Record toolchain
        shell: bash
        run: |
          clang --version
          uname -srm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run runtime
      - run: pnpm run test:runtime
      - run: pnpm run test:golden
      - run: pnpm run test:builtins
      - run: pnpm run test:leak

  # Its own job rather than the tail of `runtime`: an ASan build is a second full compile of the
  # runtime AND of every golden fixture's generated C, so serializing it behind the ordinary
  # golden run doubles the platform's wall clock for no ordering reason.
  asan:
    name: asan (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: macos, arch: x64, os: macos-15-intel }
          - { platform: macos, arch: arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.58.0'
      - uses: ./.github/actions/setup
      - name: Install Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libgc-dev clang llvm
          else
            brew install bdw-gc
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:asan

  # The ICU FEATURE build (plan.md Task 4.4), which the default archive must stay byte-identical
  # without -- so it is a separate build directory, a separate archive, and a separate job.
  intl:
    name: intl (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: macos, arch: x64, os: macos-15-intel }
          - { platform: macos, arch: arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.58.0'
      - uses: ./.github/actions/setup
      # icu4c is keg-only on Homebrew, so its .pc files are not on the default search path and
      # `just runtime-intl` would report ICU missing on a machine that has it.
      - name: Install ICU and Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libicu-dev libgc-dev clang llvm
          else
            brew install icu4c bdw-gc
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:intl
