name: ci

on:
  push:
    branches: [main]
  # PRs get the same gate as main pushes (plan-notes: ci.yml ran only on main, so PRs
  # #7-#11 showed no remote CI). The revert job stays push-only by its event guard below.
  pull_request:
  workflow_dispatch:

# A push that supersedes an in-flight run cancels it: six platforms times five jobs is a lot of
# runner time to spend proving something about a commit nobody is waiting on any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `pnpm run ci` is ONE SERIAL CHAIN by design -- it is the gate a human runs before claiming a task
# done (AGENTS.md golden rule 1), and serial is what makes its first failure the interesting one.
# CI wants the opposite: every step that does not feed another should run at the same time. So the
# chain is decomposed here, and this map is what says nothing was dropped in the process:
#
#   typecheck   -> static (once) + frontend (every platform)
#   lint        -> static
#   dupes       -> static
#   test        -> frontend
#   test:coverage -> frontend (linux/x64; lcov artifact)
#   runtime     -> runtime
#   test:runtime-> runtime
#   test:subset -> frontend
#   test:golden -> runtime
#   test:builtins-> runtime
#   test:leak   -> runtime
#   test:asan   -> asan (STATOR_ASAN_FORCE=1 in CI: always the full pass, never the hash skip)
#   test:ffi    -> ffi
#
# Plus `test:intl`, which is deliberately NOT part of `pnpm run ci` (the ICU feature build is off by
# default, plan.md Task 4.4) and therefore had no coverage at all until this job existed.
# Same for `test:ffi`: it needs clang and the built archive, so it lives in its own job and in
# `moon run tests:ci`, not in the serial gate — which stays offline-runnable.

jobs:
  # Test262 is intentionally separate from pnpm run ci: a missing corpus must not make the local
  # offline gate lie, while this job makes the pinned conformance number visible on every commit.
  # The full pinned corpus is ~54k tests. Pre-speedup wall-clock was 2-3.5h on one runner (plan-notes
  # 198); in-process build + two-phase classify cut that sharply, and eight shards keep headroom
  # under the 2-hour per-job ceiling so the conformance number stays on every commit.
  test262:
    name: test262 conformance (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    timeout-minutes: 120
    steps:
      - &checkout
        uses: actions/checkout@v7
      - &setup
        uses: ./.github/actions/setup
      - uses: actions/cache@v6
        with:
          path: packages/tests/test262/corpus
          key: test262-${{ hashFiles('packages/tests/test262/pin.json') }}
      - &pnpm-install
        run: pnpm install --frozen-lockfile
      - run: pnpm run test262:fetch
      - name: Run Test262
        # STATOR_TEST_JOBS left unset: pool width defaults to os.availableParallelism() on the runner.
        run: pnpm run test262 -- --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v7
        with:
          name: test262-shard-${{ matrix.shard }}
          path: packages/tests/test262/results-${{ matrix.shard }}-of-8.json
          if-no-files-found: error

  # Where the run is actually judged. A shard sees a slice of the corpus, and both gates are
  # statements about the whole of it -- the ratchet compares corpus totals and expected-fail.txt
  # names individual tests -- so `--aggregate` reassembles the shards and applies them once.
  test262-report:
    name: test262 conformance
    runs-on: ubuntu-24.04
    needs: test262
    # `needs` alone would skip this job when a shard fails, and a skipped gate reports nothing --
    # the dishonest version of a conformance heartbeat (§9's opening paragraph). Run it whenever the
    # shards ran at all; `--aggregate` fails loudly on a missing shard file.
    if: always() && needs.test262.result != 'cancelled'
    steps:
      - *checkout
      - *setup
      - *pnpm-install
      - uses: actions/download-artifact@v8
        with:
          pattern: test262-shard-*
          path: shards
      - name: Aggregate and gate
        # `pipefail` is NOT the default for a `run:` step, and without it `tee` decides this job's
        # exit status -- the ratchet could fail and the job would still be green, which is the
        # dishonest version of a conformance heartbeat (§9's opening paragraph).
        shell: bash
        run: |
          set -o pipefail
          pnpm run test262 -- --aggregate shards 2>&1 | tee test262.log
      - name: Publish conformance summary
        if: always()
        run: grep '^test262:' test262.log >> "$GITHUB_STEP_SUMMARY" || true

  # Host-independent by construction: no native code, no filesystem semantics, no clang. Running
  # these six times would prove the same thing six times.
  static:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *setup
      - *pnpm-install
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run dupes

  # The compiler itself, which is portable TypeScript -- so this is the half of the suite Windows
  # can reach, and the reason Windows is in the matrix at all. `lint` is NOT here: a formatter check
  # would be arguing with git's line-ending translation, not with the code.
  frontend:
    name: frontend (${{ matrix.platform }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: macos, arch: x64, os: macos-15-intel }
          - { platform: macos, arch: arm64, os: macos-14 }
          - { platform: windows, arch: x64, os: windows-2025 }
          - { platform: windows, arch: arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - uses: extractions/setup-just@v4
        if: runner.os != 'Windows'
        with:
          just-version: '1.58.0'
      - *setup
      - name: Record toolchain
        shell: bash
        run: |
          node --version
          node -p "process.platform + '/' + process.arch"
          uname -srm || true
      - *pnpm-install
      - run: pnpm run typecheck
      - run: pnpm run test:subset
      # A handful of unit tests compile and execute a native binary, so they need the archive the
      # Unix justfile builds. Windows has no such toolchain, so those tests skip THEMSELVES there
      # (`NATIVE_ONLY` in tests/unit/helpers.ts) and the rest of the file still runs -- which is
      # why unit tests below are unconditional and only this build step is gated.
      # linux/x64 is the coverage owner: it has the runtime archive, so native-only tests
      # actually run, and one platform is enough for the lcov artifact.
      - name: Build runtime archive
        if: runner.os != 'Windows'
        run: pnpm run runtime
      - name: Unit tests with coverage
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: pnpm run test:coverage
      - name: Upload coverage
        if: ${{ always() && matrix.platform == 'linux' && matrix.arch == 'x64' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
      - name: Unit tests
        if: ${{ !(matrix.platform == 'linux' && matrix.arch == 'x64') }}
        run: pnpm run test

  # The C runtime and everything that links it. Unix only: the runtime's just/clang toolchain is
  # not ported to Windows, and pretending otherwise with a red job helps nobody.
  runtime:
    name: runtime (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: &unix-strategy
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, os: ubuntu-24.04 }
          - { platform: linux, arch: arm64, os: ubuntu-24.04-arm }
          - { platform: macos, arch: x64, os: macos-15-intel }
          - { platform: macos, arch: arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - &setup-just
        uses: extractions/setup-just@v4
        with:
          just-version: '1.58.0'
      - *setup
      # Without bdw-gc the justfile silently falls back to malloc and `test:leak` SKIPS -- a green
      # run that proved nothing about GC hygiene (plan.md Task 4.5). Installing it is what makes
      # the leak job's plateau assertion a real assertion.
      - &install-boehm
        name: Install Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libgc-dev clang llvm
          else
            brew install bdw-gc
          fi
      - name: Record toolchain
        shell: bash
        run: |
          clang --version
          uname -srm
      - *pnpm-install
      - run: pnpm run runtime
      - run: pnpm run test:runtime
      - run: pnpm run test:golden
      - run: pnpm run test:builtins
      - run: pnpm run test:leak

  # Its own job rather than the tail of `runtime`: an ASan build is a second full compile of the
  # runtime AND of every golden fixture's generated C, so serializing it behind the ordinary
  # golden run doubles the platform's wall clock for no ordering reason.
  asan:
    name: asan (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: *unix-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *setup-just
      - *setup
      - *install-boehm
      - *pnpm-install
      - run: pnpm run test:asan
        env:
          STATOR_ASAN_FORCE: '1'

  # The ICU FEATURE build (plan.md Task 4.4), which the default archive must stay byte-identical
  # without -- so it is a separate build directory, a separate archive, and a separate job.
  intl:
    name: intl (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: *unix-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *setup-just
      - *setup
      # icu4c is keg-only on Homebrew, so its .pc files are not on the default search path and
      # `just runtime-intl` would report ICU missing on a machine that has it.
      - name: Install ICU and Boehm GC
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libicu-dev libgc-dev clang llvm
          else
            brew install icu4c bdw-gc
            echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - *pnpm-install
      - run: pnpm run test:intl

  # Its own job rather than the tail of `runtime`: FFI failures (link plumbing, boundary
  # checks, header determinism) have different owners from runtime failures, and serializing
  # them behind the golden/leak runs would hide which half broke. Unix only, like `runtime`:
  # the harness links against the just/clang-built archive.
  ffi:
    name: ffi (${{ matrix.platform }}/${{ matrix.arch }})
    strategy: *unix-strategy
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *setup-just
      - *setup
      # SQLite ships in the macOS SDK; Linux needs the -dev package for sqlite3.h + libsqlite3.
      - name: Install Boehm GC and SQLite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libgc-dev libsqlite3-dev clang llvm
          else
            brew install bdw-gc
          fi
      - *pnpm-install
      - run: pnpm run runtime
      - run: pnpm run test:ffi
      # Task 7.2 step 9: the C-consumer example — a C main() calling an exported TS unit
      # through the emitted header (success + last_error paths, header double-build cmp).
      # `--emit-header`/`--unit-name` exist (cli/main.ts), so this builds, links, runs, and
      # byte-compares like the unit-level stub proof, as a CI step.
      - run: node packages/tests/ffi/example-c-consumer/c-consumer.ts
      # Task 7.3 Check: the SQLite demo's C main() against the emitted sqlitedemo header
      # (row-count success + nonzero-convention error paths, header double-build cmp).
      - run: node examples/ffi/sqlite/sqlite-c-main.ts

  revert-on-failure:
    name: revert-on-failure
    needs: [test262, test262-report, static, frontend, runtime, asan, intl, ffi]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && contains(join(needs.*.result, ','), 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Revert commits from this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No parent (new branch); skip revert"
            exit 0
          fi
          subject=$(git log -1 --format=%s "$AFTER")
          author=$(git log -1 --format=%an "$AFTER")
          case "$subject" in
            "ci: auto-revert"*) echo "Already an auto-revert; skip"; exit 0 ;;
          esac
          if [ "$author" = "github-actions[bot]" ]; then
            echo "Last commit is from actions bot; skip"
            exit 0
          fi
          # A revert of a push that touched .github/ would rewrite workflow files, which the
          # job's GITHUB_TOKEN cannot push without the `workflows` permission (and granting it
          # would let CI push workflow changes by itself). Leave those failures to a human.
          if git diff --name-only "$BEFORE" "$AFTER" -- .github/ | grep -q .; then
            echo "Push touched .github/; auto-revert needs 'workflows' permission — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          parent_count=$(git rev-list --parents -n 1 "$AFTER" | awk '{print NF}')
          if [ "$parent_count" -gt 2 ]; then
            git revert --no-edit -m 1 "$AFTER"
          else
            git revert --no-commit "$BEFORE".."$AFTER"
            if git diff --cached --quiet; then
              echo "Nothing to revert"
              exit 0
            fi
            short=$(git rev-parse --short "$AFTER")
            git commit -m "ci: auto-revert $short — main CI failed"
          fi
          git push origin HEAD:main
