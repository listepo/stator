name: nightly evidence

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *' || github.event.schedule == '0 3 * * 0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.58.0'
      - uses: ./.github/actions/setup
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgc-dev clang llvm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run runtime
      - name: Differential fuzzing
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *'
        run: pnpm run differential -- --minutes=60 --seed=${{ github.run_number }}
      - name: Upload differential findings
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * *')
        uses: actions/upload-artifact@v4
        with:
          name: differential-${{ github.run_number }}
          path: tests/differential/failures
          if-no-files-found: ignore

      - name: Record benchmark
        if: github.event.schedule == '0 3 * * 0'
        run: pnpm run bench:record 2>&1 | tee benchmark.log
      - name: Publish benchmark summary
        if: always() && github.event.schedule == '0 3 * * 0'
        run: grep '^bench:' benchmark.log >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload benchmark result
        if: always() && github.event.schedule == '0 3 * * 0'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_number }}
          path: tests/bench/results
          if-no-files-found: error
