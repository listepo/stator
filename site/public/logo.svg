<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="stator">
  <rect width="64" height="64" rx="12" fill="#12151C"/>
  <!-- stator ring: fixed outer housing -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#5B7CFF" stroke-width="2.5"/>
  <!-- type brackets → bits: angled T/type mark becoming binary ticks -->
  <path d="M22 22 L22 42" stroke="#8BA3FF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M22 22 L30 22" stroke="#8BA3FF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M22 42 L30 42" stroke="#8BA3FF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- machine-code bit ticks on right -->
  <rect x="36" y="20" width="3" height="8" rx="0.8" fill="#5B7CFF"/>
  <rect x="42" y="20" width="3" height="4" rx="0.8" fill="#7A94FF"/>
  <rect x="36" y="32" width="3" height="4" rx="0.8" fill="#7A94FF"/>
  <rect x="42" y="30" width="3" height="8" rx="0.8" fill="#5B7CFF"/>
  <rect x="36" y="40" width="3" height="6" rx="0.8" fill="#A8B8FF"/>
  <rect x="42" y="42" width="3" height="4" rx="0.8" fill="#5B7CFF"/>
  <!-- center static node -->
  <circle cx="32" cy="32" r="3" fill="#C5D0FF"/>
</svg>
