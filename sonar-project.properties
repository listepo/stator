# sonar.organization and sonar.projectKey are placeholders: adjust them to match the
# SonarCloud UI after the repository is imported. See the setup guide for details.
sonar.organization=listepo
sonar.projectKey=listepo_stator
sonar.projectName=stator
sonar.sourceEncoding=UTF-8
sonar.sources=packages/compiler/src
sonar.tests=packages/tests
sonar.test.exclusions=packages/tests/golden/**,packages/tests/test262/**,packages/tests/bench/**,packages/tests/differential/**,packages/tests/ffi/example-c-consumer/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# C/C++/Objective-C analysis needs a compilation database; it is off for now (see the guide).
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
